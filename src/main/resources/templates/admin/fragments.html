<th:block th:fragment="sidebar(section)">
  <aside class="admin-sidebar">
    <div class="admin-brand">Elfium Admin</div>
    <nav class="admin-nav">
      <a href="/admin" th:classappend="${section == 'dashboard'} ? ' active'">Обзор</a>
      <a href="/admin/users" th:classappend="${section == 'users'} ? ' active'">Пользователи</a>
      <a href="/express">Экспресс</a>
      <a href="/profile">Мой профиль</a>
    </nav>
  </aside>
</th:block>

<th:block th:fragment="topbar(title, currentUser)">
  <header class="admin-topbar">
    <div class="admin-topbar-title" th:text="${title}"></div>
    <div class="admin-topbar-user">
      <span class="admin-topbar-user-name" th:text="${currentUser.displayName}"></span>
      <span class="admin-topbar-user-role" th:text="${currentUser.primaryRoleTitle}"></span>
      <form th:action="@{/logout}" method="post" class="admin-logout-form">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit" class="admin-logout-button" title="Выйти">&#x23FB;</button>
      </form>
    </div>
  </header>
</th:block>
