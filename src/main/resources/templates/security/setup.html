<!DOCTYPE html>
<html lang="en">
<head>
  <th:block th:replace="~{index/head.html::indexHead}"></th:block>
</head>
<body>
  <div class="form-block">
    <div class="form-block-inner">
      <form th:action="@{/setup}" th:object="${userRegistrationDto}" method="post">
          <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <h1 class="center" th:text="${title}"></h1>

          <div class="blue">
            Создайте первого пользователя. Он будет зарегистрирован как администратор.
          </div>

          <div th:if="${registrationError}">
              <div class="red" th:text="${registrationError}"></div>
          </div>

          <div class="horizontal-field">
            <label for="lastName">Имя</label>
            <input type="text" id="lastName" th:field="*{lastName}" />
          </div>

          <div class="horizontal-field">
            <label for="email">E-mail</label>
            <input type="text" id="email" th:field="*{email}" required />
            <div class="red" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
          </div>

          <div class="horizontal-field">
            <label for="pass">Пароль</label>
            <input type="password" id="pass" th:field="*{password}" required />
            <div class="red" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
          </div>

          <div class="center horizontal-field">
            <input type="submit" value="Создать администратора" class="registration-button" />
          </div>
      </form>
    </div>
  </div>
</body>
</html>
